name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name Bookapp
          --add-data "urls.yaml;."
          --add-data "config.json;."
          --add-data "languages\en.json;languages"
          --add-data "languages\fi.json;languages"
          --add-data "languages\sv.json;languages"
          launcher.py

      - name: Create source archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: git archive --format=zip --prefix=Bookapp-${{ github.ref_name }}/ --output=dist/Bookapp-source-${{ github.ref_name }}.zip HEAD

      - name: Upload executable
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Bookapp-windows
          path: dist/Bookapp.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bookapp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Bookapp.exe
            dist/Bookapp-source-${{ github.ref_name }}.zip
