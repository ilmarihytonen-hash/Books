name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name Bookapp
          --add-data "urls.yaml;."
          --add-data "config.json;."
          --add-data "languages\en.json;languages"
          --add-data "languages\fi.json;languages"
          --add-data "languages\sv.json;languages"
          launcher.py

      - name: Create source archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: git archive --format=zip --prefix=Bookapp-${{ github.ref_name }}/ --output=dist/Bookapp-source-${{ github.ref_name }}.zip HEAD

      - name: Create portable Windows bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $bundle = "dist/Bookapp-portable"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "dist/Bookapp.exe", "Bookapp.bat", "run_bookapp.bat", "README.md" -Destination $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/Bookapp-portable-${{ github.ref_name }}.zip" -CompressionLevel Optimal

      - name: Remove retired installer assets
        if: github.ref == 'refs/tags/v1.0.4'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.3"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          foreach ($asset in @($release.assets | Where-Object name -eq "Bookapp-Setup.exe")) {
            Invoke-RestMethod -Method Delete -Uri $asset.url -Headers $headers
          }
          $artifactsUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          $artifacts = Invoke-RestMethod -Uri $artifactsUrl -Headers $headers
          foreach ($artifact in @($artifacts.artifacts | Where-Object name -eq "Bookapp-installer-windows")) {
            Invoke-RestMethod -Method Delete -Uri $artifact.url -Headers $headers
          }

      - name: Upload executable
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Bookapp-windows
          path: dist/Bookapp.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bookapp ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Windows 10/11 (64-bit):** Download and extract `Bookapp-portable-${{ github.ref_name }}.zip`, then run `Bookapp.bat`. No separate Python installation is required. The first launch creates or updates `Bookapp.lnk` beside the extracted files.

            Alternatively, download and run `Bookapp.exe` directly.
          files: |
            dist/Bookapp.exe
            dist/Bookapp-portable-${{ github.ref_name }}.zip
            dist/Bookapp-source-${{ github.ref_name }}.zip
