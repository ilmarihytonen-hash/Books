name: Build Windows and Linux releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Linux executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name Bookapp
          --add-data "urls.yaml:."
          --add-data "config.json:."
          --add-data "languages/en.json:languages"
          --add-data "languages/fi.json:languages"
          --add-data "languages/sv.json:languages"
          launcher.py

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          appdir="dist/Bookapp.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp dist/Bookapp "$appdir/usr/bin/Bookapp"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Bookapp" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          cat > "$appdir/bookapp.desktop" <<'EOF'
          [Desktop Entry]
          Name=Bookapp
          Exec=AppRun
          Icon=bookapp
          Type=Application
          Categories=Network;WebBrowser;
          Terminal=false
          EOF
          cat > "$appdir/bookapp.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect x="8" y="12" width="112" height="104" rx="18" fill="#183b56"/>
            <path d="M64 39c-15-11-30-11-43-6v52c15-5 29-4 43 6 14-10 28-11 43-6V33c-13-5-28-5-43 6z" fill="#fff"/>
            <path d="M64 40v51" fill="none" stroke="#45b6a5" stroke-width="6"/>
          </svg>
          EOF
          ln -s bookapp.svg "$appdir/.DirIcon"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$appdir" "dist/Bookapp-${GITHUB_REF_NAME}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bookapp-linux-appimage
          path: dist/Bookapp-${{ github.ref_name }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  build:
    needs: build-linux
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name Bookapp
          --add-data "urls.yaml;."
          --add-data "config.json;."
          --add-data "languages\en.json;languages"
          --add-data "languages\fi.json;languages"
          --add-data "languages\sv.json;languages"
          launcher.py

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          $version = "0.2.0-beta.1"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          & $iscc "/DMyAppVersion=$version" "Bookapp.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create source archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: git archive --format=zip --prefix=Bookapp-${{ github.ref_name }}/ --output=dist/Bookapp-source-${{ github.ref_name }}.zip HEAD

      - name: Create portable Windows bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $bundle = "dist/Bookapp-portable"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "dist/Bookapp.exe", "Bookapp.bat", "run_bookapp.bat", "README.md" -Destination $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/Bookapp-portable-${{ github.ref_name }}.zip" -CompressionLevel Optimal

      - name: Download Linux AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: Bookapp-linux-appimage
          path: dist

      - name: Remove retired installer assets
        if: github.ref == 'refs/tags/v1.0.4'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.3"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          foreach ($asset in @($release.assets | Where-Object name -eq "Bookapp-Setup.exe")) {
            Invoke-RestMethod -Method Delete -Uri $asset.url -Headers $headers
          }
          $artifactsUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          $artifacts = Invoke-RestMethod -Uri $artifactsUrl -Headers $headers
          foreach ($artifact in @($artifacts.artifacts | Where-Object name -eq "Bookapp-installer-windows")) {
            Invoke-RestMethod -Method Delete -Uri $artifact.url -Headers $headers
          }

      - name: Upload Windows builds
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Bookapp-windows
          path: |
            dist/Bookapp.exe
            dist/Bookapp-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bookapp ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Windows 10/11 (64-bit):** Download and run `Bookapp-Setup.exe` to install Bookapp. The installer defaults to the current user and does not require administrator permissions; you can choose an all-users install, which requests administrator access. It creates a Start menu shortcut and offers an optional desktop shortcut. No separate Python installation is required. To use the portable version instead, download and extract `Bookapp-portable-${{ github.ref_name }}.zip`, then run `Bookapp.bat`.

            **Linux (x86_64):** Download `Bookapp-${{ github.ref_name }}-x86_64.AppImage`, make it executable with `chmod +x Bookapp-${{ github.ref_name }}-x86_64.AppImage`, and run it. It is built on Ubuntu 22.04 (glibc 2.35) and requires FUSE 2 compatibility plus the usual X11/XCB runtime libraries.

            Alternatively, download and run `Bookapp.exe` directly on Windows. It does not need administrator permissions.
          files: |
            dist/Bookapp.exe
            dist/Bookapp-Setup.exe
            dist/Bookapp-portable-${{ github.ref_name }}.zip
            dist/Bookapp-${{ github.ref_name }}-x86_64.AppImage
            dist/Bookapp-source-${{ github.ref_name }}.zip
